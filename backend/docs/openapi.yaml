openapi: 3.1.0
info:
  title: Order Flow API
  version: 1.0.0
  description: |
    Contract for the Order Flow HTTP API. Import this file directly into
    Postman, or attach it to Postman AI when generating collections, examples,
    mocks, tests, or server implementations.

    Operations marked `x-implementation-status: implemented` exist in the
    current API. Operations marked `planned` are contracts for upcoming work.
servers:
  - url: http://localhost:3001
    description: Local development
  - url: https://api.example.com
    description: Production placeholder

tags:
  - name: Telegram Auth
  - name: Admin Auth
  - name: Service Orders
  - name: Public Menu
  - name: Admin Employees
  - name: Admin Menu Categories
  - name: Admin Menu Items

paths:
  /api/v1/telegram/session:
    post:
      tags: [Telegram Auth]
      operationId: createTelegramSession
      summary: Create a session from signed Telegram Web App data
      x-implementation-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelegramSessionRequest"
            example:
              initData: "query_id=...&user=...&auth_date=...&hash=..."
      responses:
        "201":
          description: Session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/admin/auth/login:
    post:
      tags: [Admin Auth]
      operationId: adminLogin
      summary: Log in an owner account
      x-implementation-status: implemented
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginRequest"
            example:
              username: owner
              password: replace-with-SEED_OWNER_PASSWORD
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/admin/auth/refresh:
    post:
      tags: [Admin Auth]
      operationId: refreshAdminSession
      summary: Rotate a refresh token and issue a new token pair
      x-implementation-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
      responses:
        "200":
          description: Token pair refreshed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/admin/auth/logout:
    post:
      tags: [Admin Auth]
      operationId: adminLogout
      summary: Revoke the current in-memory session
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Session revoked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/admin/auth/me:
    get:
      tags: [Admin Auth]
      operationId: getCurrentAdmin
      summary: Get the authenticated owner profile
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current owner profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/orders:
    post:
      tags: [Service Orders]
      operationId: createOrder
      summary: Create a service order
      x-implementation-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
      responses:
        "201":
          description: Order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/ValidationError"
    get:
      tags: [Service Orders]
      operationId: listOrders
      summary: List service orders
      x-implementation-status: implemented
      parameters:
        - $ref: "#/components/parameters/PageQuery"
        - $ref: "#/components/parameters/LimitQuery"
        - name: createdByUserId
          in: query
          schema:
            type: string
        - name: fulfillmentStatus
          in: query
          schema:
            $ref: "#/components/schemas/FulfillmentStatus"
        - name: paymentStatus
          in: query
          schema:
            $ref: "#/components/schemas/PaymentStatus"
        - name: assignedBaristaId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Paginated orders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderListResponse"

  /api/v1/orders/{orderId}:
    get:
      tags: [Service Orders]
      operationId: getOrder
      summary: Get order detail with timeline
      x-implementation-status: implemented
      parameters:
        - $ref: "#/components/parameters/OrderIdPath"
      responses:
        "200":
          description: Order detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/orders/{orderId}/cancel:
    post:
      tags: [Service Orders]
      operationId: cancelOrder
      summary: Cancel an unpaid order
      x-implementation-status: implemented
      parameters:
        - $ref: "#/components/parameters/OrderIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelOrderRequest"
      responses:
        "200":
          description: Order cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/menu/categories:
    get:
      tags: [Public Menu]
      operationId: listPublicMenuCategories
      summary: List active public menu categories
      x-implementation-status: planned
      responses:
        "200":
          description: Active categories ordered by display order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MenuCategoryListResponse"

  /api/v1/menu/items:
    get:
      tags: [Public Menu]
      operationId: listPublicMenuItems
      summary: List available public menu items
      x-implementation-status: planned
      parameters:
        - $ref: "#/components/parameters/CategoryIdQuery"
        - $ref: "#/components/parameters/SearchQuery"
      responses:
        "200":
          description: Available menu items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MenuItemListResponse"
        "400":
          $ref: "#/components/responses/ValidationError"

  /api/v1/admin/employees:
    get:
      tags: [Admin Employees]
      operationId: listEmployees
      summary: List employees
      x-implementation-status: planned
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PageQuery"
        - $ref: "#/components/parameters/LimitQuery"
        - $ref: "#/components/parameters/SearchQuery"
        - $ref: "#/components/parameters/UserRoleQuery"
        - $ref: "#/components/parameters/UserStatusQuery"
      responses:
        "200":
          description: Paginated employees
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Admin Employees]
      operationId: createEmployee
      summary: Create an employee
      x-implementation-status: planned
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEmployeeRequest"
      responses:
        "201":
          description: Employee created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/admin/employees/{employeeId}:
    parameters:
      - $ref: "#/components/parameters/EmployeeIdPath"
    get:
      tags: [Admin Employees]
      operationId: getEmployee
      summary: Get an employee by ID
      x-implementation-status: planned
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Employee details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Admin Employees]
      operationId: updateEmployee
      summary: Partially update an employee
      x-implementation-status: planned
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEmployeeRequest"
      responses:
        "200":
          description: Employee updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/admin/employees/{employeeId}/activate:
    post:
      tags: [Admin Employees]
      operationId: activateEmployee
      summary: Activate an employee
      x-implementation-status: planned
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/EmployeeIdPath"
      responses:
        "200":
          description: Employee activated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/admin/employees/{employeeId}/deactivate:
    post:
      tags: [Admin Employees]
      operationId: deactivateEmployee
      summary: Deactivate an employee
      x-implementation-status: planned
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/EmployeeIdPath"
      responses:
        "200":
          description: Employee deactivated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/admin/menu-categories:
    get:
      tags: [Admin Menu Categories]
      operationId: listAdminMenuCategories
      summary: List all menu categories
      x-implementation-status: planned
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/SearchQuery"
        - name: isActive
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Menu categories
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MenuCategoryListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Admin Menu Categories]
      operationId: createMenuCategory
      summary: Create a menu category
      x-implementation-status: planned
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMenuCategoryRequest"
      responses:
        "201":
          description: Category created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MenuCategoryResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/admin/menu-categories/{categoryId}:
    parameters:
      - $ref: "#/components/parameters/CategoryIdPath"
    patch:
      tags: [Admin Menu Categories]
      operationId: updateMenuCategory
      summary: Partially update a menu category
      x-implementation-status: planned
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMenuCategoryRequest"
      responses:
        "200":
          description: Category updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MenuCategoryResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [Admin Menu Categories]
      operationId: deleteMenuCategory
      summary: Delete an unused menu category
      x-implementation-status: planned
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Category deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/admin/menu-items:
    get:
      tags: [Admin Menu Items]
      operationId: listAdminMenuItems
      summary: List all menu items
      x-implementation-status: planned
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PageQuery"
        - $ref: "#/components/parameters/LimitQuery"
        - $ref: "#/components/parameters/SearchQuery"
        - $ref: "#/components/parameters/CategoryIdQuery"
        - name: isAvailable
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Paginated menu items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedMenuItemListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Admin Menu Items]
      operationId: createMenuItem
      summary: Create a menu item
      x-implementation-status: planned
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMenuItemRequest"
      responses:
        "201":
          description: Menu item created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MenuItemResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/admin/menu-items/{itemId}:
    parameters:
      - $ref: "#/components/parameters/ItemIdPath"
    get:
      tags: [Admin Menu Items]
      operationId: getMenuItem
      summary: Get a menu item by ID
      x-implementation-status: planned
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Menu item details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MenuItemResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Admin Menu Items]
      operationId: updateMenuItem
      summary: Partially update a menu item
      x-implementation-status: planned
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMenuItemRequest"
      responses:
        "200":
          description: Menu item updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MenuItemResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [Admin Menu Items]
      operationId: deleteMenuItem
      summary: Delete an unused menu item
      x-implementation-status: planned
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Menu item deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    EmployeeIdPath:
      name: employeeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CategoryIdPath:
      name: categoryId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ItemIdPath:
      name: itemId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OrderIdPath:
      name: orderId
      in: path
      required: true
      schema:
        type: string
    CategoryIdQuery:
      name: categoryId
      in: query
      schema:
        type: string
        format: uuid
    SearchQuery:
      name: search
      in: query
      schema:
        type: string
        maxLength: 150
    PageQuery:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    LimitQuery:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    UserRoleQuery:
      name: role
      in: query
      schema:
        $ref: "#/components/schemas/EmployeeRole"
    UserStatusQuery:
      name: status
      in: query
      schema:
        $ref: "#/components/schemas/UserStatus"

  responses:
    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: VALIDATION_ERROR
              message: Request validation failed
              details:
                - path: username
                  message: Required
    Unauthorized:
      description: Authentication failed or session expired
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: UNAUTHORIZED
              message: Invalid or expired token
    Forbidden:
      description: Authenticated account lacks permission or is inactive
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Requested resource was not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: The operation conflicts with existing data or business rules
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    TelegramSessionRequest:
      type: object
      additionalProperties: false
      required: [initData]
      properties:
        initData:
          type: string
          minLength: 1
          maxLength: 10000

    AdminLoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 100
        password:
          type: string
          minLength: 8
          maxLength: 200

    RefreshTokenRequest:
      type: object
      additionalProperties: false
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          minLength: 1

    UserRole:
      type: string
      enum: [OWNER, SERVICE_STAFF, BARISTA]
    EmployeeRole:
      type: string
      enum: [SERVICE_STAFF, BARISTA]
    UserStatus:
      type: string
      enum: [ACTIVE, INACTIVE]

    PaymentStatus:
      type: string
      enum: [UNPAID, PENDING, PAID, UNDERPAID, OVERPAID, REVIEW]
    FulfillmentStatus:
      type: string
      enum: [PENDING_PAYMENT, QUEUED, PREPARING, READY, DELIVERED, CANCELLED]
    PaymentMethod:
      type: string
      enum: [QR, CASH]
    OrderStatusDomain:
      type: string
      enum: [PAYMENT, FULFILLMENT]

    CreateOrderItemRequest:
      type: object
      additionalProperties: false
      required: [menuItemId, quantity]
      properties:
        menuItemId:
          type: string
        quantity:
          type: integer
          minimum: 1
        note:
          type: string
    CreateOrderRequest:
      type: object
      additionalProperties: false
      required: [createdByUserId, items]
      properties:
        createdByUserId:
          type: string
        paymentMethod:
          $ref: "#/components/schemas/PaymentMethod"
        customerNote:
          type: string
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/CreateOrderItemRequest"
    CancelOrderRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
        requesterId:
          type: string
    OrderItem:
      type: object
      required: [id, orderId, menuItemId, itemName, unitPrice, quantity]
      properties:
        id:
          type: string
        orderId:
          type: string
        menuItemId:
          type: string
        itemName:
          type: string
        unitPrice:
          type: string
          description: BigInt amount serialized by the runtime JSON layer.
        quantity:
          type: integer
        note:
          type: [string, "null"]
    OrderTimelineEntry:
      type: object
      required: [id, orderId, statusDomain, newStatus, createdAt]
      properties:
        id:
          type: string
        orderId:
          type: string
        statusDomain:
          $ref: "#/components/schemas/OrderStatusDomain"
        oldStatus:
          type: [string, "null"]
        newStatus:
          type: string
        changedByUserId:
          type: [string, "null"]
        reason:
          type: [string, "null"]
        createdAt:
          type: string
          format: date-time
    Order:
      type: object
      required: [id, orderCode, createdByUserId, paymentStatus, fulfillmentStatus, totalAmount, items, createdAt, updatedAt]
      properties:
        id:
          type: string
        orderCode:
          type: string
        createdByUserId:
          type: string
        assignedBaristaId:
          type: [string, "null"]
        paymentMethod:
          anyOf:
            - $ref: "#/components/schemas/PaymentMethod"
            - type: "null"
        paymentStatus:
          $ref: "#/components/schemas/PaymentStatus"
        fulfillmentStatus:
          $ref: "#/components/schemas/FulfillmentStatus"
        totalAmount:
          type: string
          description: BigInt amount serialized by the runtime JSON layer.
        customerNote:
          type: [string, "null"]
        cancellationReason:
          type: [string, "null"]
        paidAt:
          type: [string, "null"]
          format: date-time
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        timeline:
          type: array
          items:
            $ref: "#/components/schemas/OrderTimelineEntry"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    OrderListResponse:
      type: object
      required: [data, total, page, limit]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Order"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer

    AuthUser:
      type: object
      additionalProperties: false
