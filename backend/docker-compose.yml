services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: order_flow
      POSTGRES_USER: order_flow
      POSTGRES_PASSWORD: order_flow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U order_flow -d order_flow"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
