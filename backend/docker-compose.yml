services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: order_flow
      POSTGRES_USER: order_flow
      POSTGRES_PASSWORD: order_flow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:

